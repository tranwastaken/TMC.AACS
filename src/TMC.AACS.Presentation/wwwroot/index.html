<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <!-- viewport: bắt buộc để hiển thị đúng trên điện thoại (responsive) -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TMC AACS</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f5f5f5; }
    main { max-width: 480px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; }
    #status { font-weight: bold; }
  </style>
</head>
<body>
  <main>
    <h1>TMC AACS</h1>
    <p>Trang giữ chỗ. Màn hình App Nhân viên và Kiosk sẽ thay thế file này.</p>
    <p>Trạng thái server: <span id="status">đang kiểm tra...</span></p>
  </main>
  <script>
    fetch('/api/health')
      .then(r => r.json())
      .then(d => document.getElementById('status').textContent = d.status)
      .catch(() => document.getElementById('status').textContent = 'không kết nối được');
  </script>
</body>
</html>
